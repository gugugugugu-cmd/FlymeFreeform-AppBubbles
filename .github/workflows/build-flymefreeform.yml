# FlymeFreeform — Phase 2 release 构建工作流
# 编译 release 版本（不签名，输出 unsigned APK）
name: Build FlymeFreeform (Phase 2)

on:
  workflow_dispatch:      # 手动触发
  push:
    branches: [main, 'phase*', 'feature/**']

permissions:
  contents: write         # 允许上传 artifact

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk=37 在 Google 仓库中的包名为 platforms;android-37.0
      # （目录 android-37.0，AGP 按 platforms/android-37 查找），需显式安装并软链。
      - name: Install Android SDK platform 37 + build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-$HOME/android-sdk}"
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            curl -sSL -o /tmp/ct.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q /tmp/ct.zip -d /tmp/ct
            mv /tmp/ct/cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/"
          fi
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" \
            "platforms;android-37.0" "build-tools;36.0.0" "platform-tools"
          ln -sfn "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release (unsigned)
        # 不设置任何签名环境变量 → release keystore 为空 → 产出未签名 APK
        # 顺带构建阶段 5 的 IPC 安全验证夹具（独立模块，不进主 APK）
        run: ./gradlew assembleRelease :androidTest:assembleDebug --no-daemon --stacktrace

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlymeFreeform-phase2-release
          path: |
            app/build/outputs/apk/release/*.apk
            androidTest/build/outputs/apk/debug/*.apk
          if-no-files-found: error
